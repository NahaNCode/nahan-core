name: Publish container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test isolated NahaN API
        working-directory: lab
        run: python3 -m unittest test_panel.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export verified runtime
        run: |
          docker pull ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}
          id=$(docker create ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA})
          docker cp "$id:/usr/local/bin/NahaN" ./NahaN
          docker rm "$id"
          sha256sum NahaN > NahaN.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nahan-core-linux-amd64
          path: |
            NahaN
            NahaN.sha256
