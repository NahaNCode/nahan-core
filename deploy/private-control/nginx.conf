limit_req_zone $binary_remote_addr zone=nahan_control_limit:1m rate=20r/s;
server {
    listen 443 ssl;
    server_name control.nahan.internal;
    ssl_certificate /etc/nginx/certs/nahan-control.chain.pem;
    ssl_certificate_key /etc/nginx/certs/nahan-control.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    client_body_timeout 15s;
    send_timeout 15s;
    access_log off;
    location ~ "^/api/core/v1/(hosts/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/(manifest|heartbeat)|cores/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/(manifest|heartbeat|jobs|jobs/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/result|egress|egress/(identity|credentials|receipt|health)|connection-policy|connection-policy/receipt|exit-routing|exit-routing/(report|receipt)|updates/runtime)|nodes/[1-9][0-9]*/(server|subscriptions|heartbeat|traffic|onlineip|device-leases))$" {
        limit_req zone=nahan_control_limit burst=60 nodelay;
        limit_except GET POST { deny all; }
        proxy_pass http://152.53.172.146:9587;
        proxy_set_header Host pwaapi.nahanvpn.com;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location / { return 404; }
}
