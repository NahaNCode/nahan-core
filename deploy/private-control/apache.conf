<VirtualHost 152.53.176.197:443>
    ServerName control.nahan.internal
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /etc/nahan-control/ocean197.chain.pem
    SSLCertificateKeyFile /etc/nahan-control/ocean197.key
    ProxyRequests Off
    ProxyTimeout 10
    LimitRequestBody 1048576
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/api/core/v1/(hosts/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/(manifest|heartbeat)|cores/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/(manifest|heartbeat|jobs|jobs/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/result|egress|egress/(identity|credentials|receipt|health)|connection-policy|connection-policy/receipt|exit-routing|exit-routing/(report|receipt)|updates/runtime)|nodes/[1-9][0-9]*/(server|subscriptions|heartbeat|traffic|onlineip|device-leases))$
    RewriteRule ^ - [F,L]
    <Location /api/core/v1/>
        Require all granted
        <LimitExcept GET POST>
            Require all denied
        </LimitExcept>
    </Location>
    ProxyPass /api/core/v1/ http://152.53.172.146:9587/api/core/v1/
</VirtualHost>
